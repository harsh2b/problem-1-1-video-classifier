# Fill this in before you submit -- our evaluator runs these commands
# EXACTLY as written, in this order, from a fresh checkout of your fork.
# Keep every command non-interactive (no prompts) and idempotent.

setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --benchmark"

test_commands:
  - "pytest tests -v"

notes: "Lightweight Multimodal Video Classifier (~100k parameters, <400KB footprint). Uses Gated Temporal Attention MIL with sparse keyframes and inter-frame kinetic delta to route videos to optimal chunking policies. Evaluates in <1 second with a custom PEAS Pareto efficiency metric and 95% Bootstrap CI."
