# Fill this in before you submit -- our evaluator runs these commands
# EXACTLY as written, in this order, from a fresh checkout of your fork.
# Keep every command non-interactive (no prompts) and idempotent.

setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --benchmark"

test_commands:
  - "pytest tests -v"

notes: "Lightweight Multimodal Video Classifier (~350k parameters, 1.3MB footprint). Uses Kinetic Gated Attention MIL with sparse keyframes and statistical temporal skip pooling to route videos to optimal chunking policies. Evaluates in <1 ms on CPU with 0.8060 Macro-F1, 73.91% accuracy (95% CI: [52.2%, 91.3%]), and custom PEAS Pareto efficiency metric."
